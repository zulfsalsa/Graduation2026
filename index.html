<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengumuman Kelulusan</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --amber:        #BA7517;
      --amber-hover:  #9a6010;
      --amber-light:  #FAEEDA;
      --amber-border: #FAC775;
      --amber-dark:   #633806;
      --bg:    #ffffff;
      --bg2:   #f7f6f3;
      --bg3:   #efede8;
      --text:  #1c1917;
      --text2: #57534e;
      --text3: #a8a29e;
      --bdr:   #e7e5e4;
      --bdr2:  #d6d3d1;
      --green-bg:  #f0fdf4; --green-bdr: #86efac; --green-txt: #15803d;
      --red-bg:    #fef2f2; --red-bdr:   #fca5a5; --red-txt:   #dc2626;
      --warn-bg:   #fffbeb; --warn-bdr:  #fcd34d; --warn-txt:  #b45309;
      --r: 10px; --r-lg: 16px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg2);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes confDrop {
      0%   { transform: translateY(0)    rotate(0deg);   opacity: 1; }
      100% { transform: translateY(110vh) rotate(600deg); opacity: 0; }
    }
    .fu { animation: fadeUp .45s ease both; }

    /* ── Layout ── */
    .page-center {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: var(--bg);
      border: 1px solid var(--bdr);
      border-radius: var(--r-lg);
    }
    .admin-wrap { max-width: 980px; margin: 0 auto; padding: 1.75rem 1.25rem; }

    /* ── Form ── */
    .field-label {
      display: block;
      font-size: 11px; font-weight: 600;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--text2); margin-bottom: 5px;
    }
    input.fi {
      display: block; width: 100%;
      padding: 10px 13px;
      border: 1px solid var(--bdr2); border-radius: var(--r);
      background: var(--bg); color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 15px;
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    input.fi:focus {
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(186,117,23,.12);
    }
    input.fi::placeholder { color: var(--text3); }
    input.fi-sm { font-size: 13px; padding: 8px 11px; }
    input.fi-search {
      padding: 7px 12px; border: 1px solid var(--bdr2); border-radius: var(--r);
      background: var(--bg2); color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none;
      width: 220px;
    }
    input.fi-search:focus { border-color: var(--amber); }

    /* ── Buttons ── */
    .btn-primary {
      display: block; width: 100%; padding: 11px;
      background: var(--amber); border: none; border-radius: var(--r);
      color: var(--amber-light);
      font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    .btn-primary:hover { background: var(--amber-hover); }
    .btn-primary:disabled { opacity: .65; cursor: not-allowed; }

    .btn-ghost {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px;
      background: transparent; border: 1px solid var(--bdr2); border-radius: var(--r);
      color: var(--text2);
      font-family: 'DM Sans', sans-serif; font-size: 13px;
      cursor: pointer; transition: background .15s;
    }
    .btn-ghost:hover { background: var(--bg2); }

    .btn-add {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 14px;
      background: var(--amber); border: none; border-radius: var(--r);
      color: var(--amber-light);
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    .btn-add:hover { background: var(--amber-hover); }

    .btn-save {
      padding: 8px 22px;
      background: var(--amber); border: none; border-radius: var(--r);
      color: var(--amber-light);
      font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
      cursor: pointer;
    }
    .btn-save:hover { background: var(--amber-hover); }

    .btn-cancel {
      padding: 8px 16px;
      background: transparent; border: 1px solid var(--bdr2); border-radius: var(--r);
      color: var(--text2);
      font-family: 'DM Sans', sans-serif; font-size: 14px;
      cursor: pointer;
    }
    .btn-cancel:hover { background: var(--bg2); }

    .btn-dl {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px;
      background: var(--amber); border: none; border-radius: var(--r);
      color: var(--amber-light); text-decoration: none;
      font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background .15s, transform .1s;
    }
    .btn-dl:hover { background: var(--amber-hover); transform: translateY(-1px); }

    .btn-tbl {
      padding: 4px 10px; border-radius: 6px;
      font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer;
    }
    .btn-edit { background: var(--bg2); border: 1px solid var(--bdr); color: var(--text2); }
    .btn-del  { background: var(--red-bg); border: 1px solid var(--red-bdr); color: var(--red-txt); margin-left: 4px; }

    /* ── Alerts ── */
    .alert {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 10px 14px; border-radius: var(--r);
      font-size: 13px; border: 1px solid; line-height: 1.55;
    }
    .alert i { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
    .a-err  { background: var(--red-bg);  border-color: var(--red-bdr);  color: var(--red-txt); }
    .a-warn { background: var(--warn-bg); border-color: var(--warn-bdr); color: var(--warn-txt); }
    .a-tip  { background: var(--amber-light); border-color: var(--amber-border); color: var(--amber-dark); }
    .a-ok   { background: var(--green-bg); border-color: var(--green-bdr); color: var(--green-txt); }

    /* ── Status badges ── */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 16px; border-radius: 100px;
      font-size: 11px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      border: 1px solid;
    }
    .badge-lulus { background: var(--green-bg); border-color: var(--green-bdr); color: var(--green-txt); }
    .badge-tidak { background: var(--red-bg);   border-color: var(--red-bdr);   color: var(--red-txt); }

    .pill {
      display: inline-block; padding: 2px 9px; border-radius: 100px;
      font-size: 10px; font-weight: 700;
    }
    .pill-l { background: var(--green-bg); color: var(--green-txt); }
    .pill-t { background: var(--red-bg);   color: var(--red-txt); }

    /* ── Toggle status ── */
    .toggle-grp { display: flex; gap: 6px; }
    .tgl {
      flex: 1; padding: 9px; border-radius: var(--r);
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
      cursor: pointer; border: 1px solid var(--bdr); background: transparent; color: var(--text2);
      transition: all .15s;
    }
    .tgl-l { background: var(--green-bg); border-color: var(--green-bdr); color: var(--green-txt); }
    .tgl-t { background: var(--red-bg);   border-color: var(--red-bdr);   color: var(--red-txt); }

    /* ── Stat cards ── */
    .stat-card {
      background: var(--bg2); border-radius: var(--r);
      padding: 1.1rem; text-align: center;
    }
    .stat-val { font-size: 24px; font-weight: 500; color: var(--text); }
    .stat-lbl { font-size: 11px; color: var(--text3); letter-spacing: .05em; margin-top: 2px; }

    /* ── Admin header ── */
    .admin-hdr {
      display: flex; justify-content: space-between; align-items: flex-start;
      flex-wrap: wrap; gap: 12px;
      margin-bottom: 1.5rem; padding-bottom: 1.1rem;
      border-bottom: 1px solid var(--bdr);
    }
    .section-lbl {
      font-size: 11px; font-weight: 600;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--text2); margin-bottom: .9rem;
    }
    .search-row {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 8px; margin-bottom: 1rem;
    }

    /* ── Table ── */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; padding: 7px 10px;
      border-bottom: 1px solid var(--bdr);
      font-size: 11px; font-weight: 600;
      letter-spacing: .06em; text-transform: uppercase;
      color: var(--text2); white-space: nowrap;
    }
    td {
      padding: 8px 10px; border-bottom: 1px solid var(--bdr);
      color: var(--text); vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--bg2); }
    .td-mono { font-family: monospace; font-size: 12px; color: var(--text2); }
    .td-dim  { font-size: 12px; color: var(--text3); }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.42);
      display: flex; align-items: flex-start; justify-content: center;
      padding: 3rem 1rem; z-index: 200; overflow-y: auto;
    }
    .modal {
      background: var(--bg); border: 1px solid var(--bdr); border-radius: var(--r-lg);
      padding: 1.75rem; width: 100%; max-width: 520px;
      animation: fadeUp .3s ease;
    }
    .modal-title {
      font-family: 'Lora', serif; font-size: 19px; font-weight: 700;
      color: var(--text); margin-bottom: 1.25rem;
    }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

    /* ── Grid ── */
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .ga { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 12px; }

    /* ── Confetti ── */
    .conf-wrap {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; z-index: 999; overflow: hidden;
    }
    .conf-piece {
      position: absolute; top: -16px;
      border-radius: 2px;
      animation: confDrop linear forwards;
    }

    /* ── Divider ── */
    hr { border: none; border-top: 1px solid var(--bdr); margin: 1.25rem 0; }

    /* ── Misc ── */
    code {
      background: var(--bg2); padding: 2px 7px;
      border-radius: 5px; font-size: .88em;
    }
    .empty-state {
      text-align: center; padding: 3rem 1rem;
      color: var(--text3); font-size: 14px;
    }

    /* ── Responsive ── */
    @media (max-width: 580px) {
      .g2 { grid-template-columns: 1fr; }
      .fi-search { width: 160px; }
      .hide-sm { display: none !important; }
    }
  </style>
</head>
<body>
<div id="app"></div>

<script>
/* ================================================================
   STORAGE & DEFAULTS
================================================================ */
const STORE_KEY = 'graduation_v1';

const DEFAULTS = {
  school_info: {
    name: 'SMP Al Mauludi',
    year: '2025/2026',
    admin_password: 'Mauludi_2017'
  },
  students: [
    { id: 's1', nisn: '1234567890', password: 'budi2025', nama: 'Budi Santoso',  kelas: 'XII IPA 1', lulus: true,  skl_url: '' },
    { id: 's2', nisn: '0987654321', password: 'ani2025',  nama: 'Ani Rahayu',    kelas: 'XII IPS 2', lulus: false, skl_url: '' }
  ]
};

function loadData()   { try { const r = localStorage.getItem(STORE_KEY); return r ? JSON.parse(r) : DEFAULTS; } catch { return DEFAULTS; } }
function persists(d)  { try { localStorage.setItem(STORE_KEY, JSON.stringify(d)); } catch {} }
function uid()        { return Math.random().toString(36).substr(2, 9); }
function toDL(url)    { if (!url) return ''; const m = url.match(/\/d\/([-\w]+)/); return m ? `https://drive.google.com/uc?export=download&id=${m[1]}` : url; }

/* ================================================================
   STATE
================================================================ */
let S = { view: 'login', student: null, data: loadData() };

function go(patch) {
  Object.assign(S, patch);
  if (patch.data) persists(patch.data);
  render();
}

/* ================================================================
   DOM HELPERS
================================================================ */
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'cls')   e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else e.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    e.appendChild(typeof kid === 'string' || typeof kid === 'number'
      ? document.createTextNode(String(kid)) : kid);
  }
  return e;
}

function ic(name, style) {
  return el('i', { cls: `ti ti-${name}`, 'aria-hidden': 'true', style: style || {} });
}

function fieldRow(label, inp) {
  return el('div', { style: { marginBottom: '12px' } },
    el('label', { cls: 'field-label' }, label), inp
  );
}

function mkInp(opts) {
  const i = document.createElement('input');
  i.className = 'fi';
  Object.entries(opts || {}).forEach(([k, v]) => {
    if (k === 'value') i.value = v;
    else if (k === 'type') i.type = v;
    else if (k === 'placeholder') i.placeholder = v;
    else if (k === 'maxlength') i.maxLength = v;
    else if (k === 'cls') i.className = v;
  });
  return i;
}

function alertEl(type, msg) {
  const map = { err: ['a-err', 'alert-circle'], warn: ['a-warn', 'clock'], tip: ['a-tip', 'bulb'], ok: ['a-ok', 'circle-check'] };
  const [cls, ico] = map[type] || map.tip;
  const d = el('div', { cls: `alert ${cls}` });
  d.innerHTML = `<i class="ti ti-${ico}" aria-hidden="true" style="font-size:15px;flex-shrink:0;margin-top:1px"></i><span>${msg}</span>`;
  return d;
}

/* ================================================================
   CONFETTI
================================================================ */
function showConfetti() {
  const colors = ['#C9A84C','#4ade80','#60a5fa','#f472b6','#facc15','#a78bfa','#34d399','#fb923c'];
  const wrap = el('div', { cls: 'conf-wrap' });
  for (let i = 0; i < 45; i++) {
    const sz = (Math.random() * 6 + 7).toFixed(1) + 'px';
    wrap.appendChild(el('div', { cls: 'conf-piece', style: {
      left: (Math.random() * 90 + 4) + '%',
      background: colors[i % colors.length],
      width: sz, height: sz,
      animationDelay: (Math.random() * 2.8).toFixed(2) + 's',
      animationDuration: (Math.random() * 2 + 2.8).toFixed(2) + 's',
    }}));
  }
  document.body.appendChild(wrap);
  setTimeout(() => wrap.remove(), 7000);
}

/* ================================================================
   LOGIN
================================================================ */
function renderLogin() {
  const d = S.data;
  document.title = 'Pengumuman Kelulusan – ' + d.school_info.name;

  const nisnInp = mkInp({ type: 'text', placeholder: 'Masukkan NISN', maxlength: 10 });
  const pwInp   = mkInp({ type: 'password', placeholder: 'Masukkan kata sandi' });
  const errBox  = el('div', { style: { marginTop: '10px' } });
  const btn     = el('button', { cls: 'btn-primary', style: { marginTop: '6px' }, onClick: attempt }, 'Lihat Hasil Kelulusan');
  let busy = false;

  nisnInp.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
  pwInp.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });

  function attempt() {
    if (busy) return;
    errBox.innerHTML = '';
    const n = nisnInp.value.trim(), p = pwInp.value;
    if (!n || !p) { errBox.appendChild(alertEl('err', 'Mohon isi NISN dan kata sandi.')); return; }
    busy = true; btn.disabled = true; btn.textContent = 'Memeriksa...';
    setTimeout(() => {
      const found = d.students.find(x => x.nisn === n && x.password === p);
      if (found) { if (found.lulus) showConfetti(); go({ view: 'dashboard', student: found }); }
      else {
        errBox.innerHTML = '';
        errBox.appendChild(alertEl('err', 'NISN atau kata sandi tidak sesuai.'));
        busy = false; btn.disabled = false; btn.textContent = 'Lihat Hasil Kelulusan';
      }
    }, 550);
  }

  return el('div', { cls: 'page-center' },
    el('div', { cls: 'card fu', style: { width: '100%', maxWidth: '400px', padding: '2.75rem 2.25rem' } },
      el('div', { style: { width: '62px', height: '62px', borderRadius: '50%', background: '#FAC775', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 1.4rem', color: '#633806' } },
        ic('certificate', { fontSize: '27px' })
      ),
      el('h1', { style: { fontFamily: "'Lora',serif", fontSize: '22px', fontWeight: '700', textAlign: 'center', color: 'var(--text)', marginBottom: '5px' } }, 'Pengumuman Kelulusan'),
      el('p', { style: { textAlign: 'center', fontSize: '13px', color: 'var(--text2)', marginBottom: '2rem' } }, d.school_info.name + ' · T.A. ' + d.school_info.year),
      fieldRow('NISN', nisnInp),
      fieldRow('Kata Sandi', pwInp),
      btn, errBox,
      el('div', { style: { marginTop: '2.5rem', textAlign: 'center', fontSize: '12px', color: 'var(--text3)', cursor: 'pointer' },
          onClick: () => go({ view: 'admin-login' }) },
        ic('lock', { fontSize: '11px', marginRight: '3px' }), ' Admin'
      )
    )
  );
}

/* ================================================================
   DASHBOARD
================================================================ */
function renderDashboard() {
  const s = S.student, info = S.data.school_info, dl = toDL(s.skl_url);
  document.title = `Hasil Kelulusan – ${s.nama}`;

  const action = el('div');
  if (s.lulus) {
    action.appendChild(el('p', { style: { fontSize: '14px', color: 'var(--text2)', lineHeight: '1.7', marginBottom: '1.25rem' } },
      'Selamat! Kamu telah berhasil menyelesaikan pendidikan di ',
      el('strong', {}, info.name), '. Semangat untuk langkah berikutnya!'
    ));
    action.appendChild(
      dl
        ? el('a', { cls: 'btn-dl', href: dl, target: '_blank', rel: 'noreferrer' }, ic('download', { fontSize: '16px' }), ' Unduh Surat Keterangan Lulus')
        : alertEl('warn', 'SKL sedang dipersiapkan. Hubungi guru/wali kelas untuk info lebih lanjut.')
    );
  } else {
    action.appendChild(alertEl('err', 'Berdasarkan data yang ada, kamu <strong>belum dinyatakan lulus</strong> pada tahun ajaran ini. Segera hubungi <strong>guru atau wali kelas</strong> untuk informasi dan langkah selanjutnya.'));
  }

  const badgeEl = el('div', { style: { marginBottom: '1.25rem' } });
  badgeEl.innerHTML = `<span class="badge ${s.lulus ? 'badge-lulus' : 'badge-tidak'}"><i class="ti ti-${s.lulus ? 'circle-check' : 'circle-x'}" aria-hidden="true" style="font-size:13px"></i>${s.lulus ? 'DINYATAKAN LULUS' : 'BELUM DINYATAKAN LULUS'}</span>`;

  return el('div', { cls: 'page-center' },
    el('div', { cls: 'card fu', style: { width: '100%', maxWidth: '490px', padding: '2.75rem 2.25rem', textAlign: 'center' } },
      badgeEl,
      el('div', { style: { marginBottom: '12px' } },
        ic(s.lulus ? 'trophy' : 'clipboard-list', { fontSize: '46px', color: s.lulus ? 'var(--amber)' : 'var(--text3)' })
      ),
      el('h2', { style: { fontFamily: "'Lora',serif", fontSize: '25px', fontWeight: '700', color: 'var(--text)', marginBottom: '5px' } }, s.nama),
      el('p', { style: { fontSize: '13px', color: 'var(--text2)', marginBottom: '1.75rem' } }, s.kelas + ' · T.A. ' + info.year),
      action, el('hr'),
      el('button', { cls: 'btn-ghost', style: { margin: '0 auto', justifyContent: 'center' }, onClick: () => go({ view: 'login', student: null }) },
        ic('logout', { fontSize: '14px' }), ' Keluar'
      )
    )
  );
}

/* ================================================================
   ADMIN LOGIN
================================================================ */
function renderAdminLogin() {
  document.title = 'Admin – Pengumuman Kelulusan';
  const pwInp = mkInp({ type: 'password', placeholder: 'Password admin' });
  const errBox = el('div', { style: { marginTop: '10px' } });

  function attempt() {
    if (pwInp.value === S.data.school_info.admin_password) go({ view: 'admin' });
    else { errBox.innerHTML = ''; errBox.appendChild(alertEl('err', 'Kata sandi admin tidak sesuai.')); }
  }
  pwInp.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });

  return el('div', { cls: 'page-center' },
    el('div', { cls: 'card fu', style: { width: '100%', maxWidth: '380px', padding: '2.75rem 2.25rem' } },
      el('div', { style: { width: '54px', height: '54px', borderRadius: '50%', background: 'var(--bg2)', border: '1px solid var(--bdr)', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 1.4rem' } },
        ic('lock', { fontSize: '21px', color: 'var(--text2)' })
      ),
      el('h2', { style: { fontFamily: "'Lora',serif", fontSize: '21px', fontWeight: '700', textAlign: 'center', color: 'var(--text)', marginBottom: '5px' } }, 'Panel Admin'),
      el('p', { style: { textAlign: 'center', fontSize: '13px', color: 'var(--text2)', marginBottom: '1.75rem' } }, 'Masuk sebagai administrator'),
      fieldRow('Kata Sandi Admin', pwInp),
      el('button', { cls: 'btn-primary', onClick: attempt }, 'Masuk'), errBox,
      el('div', { style: { marginTop: '1.5rem', textAlign: 'center', fontSize: '13px', color: 'var(--text3)', cursor: 'pointer' },
          onClick: () => go({ view: 'login' }) }, '← Kembali ke Login Siswa')
    )
  );
}

/* ================================================================
   STUDENT MODAL
================================================================ */
function openModal(existing, onSave) {
  const isEdit = !!existing;
  const f = existing ? { ...existing } : { id: '', nisn: '', password: '', nama: '', kelas: '', lulus: true, skl_url: '' };

  const nisnInp  = mkInp({ type: 'text', placeholder: '10 digit NISN', maxlength: 10, value: f.nisn || '' });
  const pwInp    = mkInp({ type: 'text', placeholder: 'Password untuk siswa', value: f.password || '' });
  const namaInp  = mkInp({ type: 'text', placeholder: 'Nama lengkap siswa', value: f.nama || '' });
  const kelasInp = mkInp({ type: 'text', placeholder: 'Contoh: XII IPA 1', value: f.kelas || '' });
  const sklInp   = mkInp({ type: 'url', placeholder: 'https://drive.google.com/file/d/.../view', value: f.skl_url || '' });

  const sklRow = el('div', { style: { marginBottom: '12px', display: f.lulus ? 'block' : 'none' } },
    el('label', { cls: 'field-label' }, 'Link SKL (Google Drive)'), sklInp
  );

  const btnL = el('button', { cls: 'tgl' + (f.lulus ? ' tgl-l' : ''), type: 'button' }, 'Lulus');
  const btnT = el('button', { cls: 'tgl' + (!f.lulus ? ' tgl-t' : ''), type: 'button' }, 'Tdk Lulus');

  btnL.onclick = () => { f.lulus = true;  btnL.className = 'tgl tgl-l'; btnT.className = 'tgl'; sklRow.style.display = 'block'; };
  btnT.onclick = () => { f.lulus = false; btnT.className = 'tgl tgl-t'; btnL.className = 'tgl'; sklRow.style.display = 'none'; };

  function save() {
    const ns = { id: f.id || uid(), nisn: nisnInp.value.trim(), password: pwInp.value.trim(), nama: namaInp.value.trim(), kelas: kelasInp.value.trim(), lulus: f.lulus, skl_url: sklInp.value.trim() };
    if (!ns.nisn || !ns.nama || !ns.password) { alert('NISN, Nama, dan Password wajib diisi.'); return; }
    if (!isEdit && S.data.students.find(s => s.nisn === ns.nisn)) { alert('NISN sudah terdaftar!'); return; }
    overlay.remove();
    onSave(ns);
  }

  const overlay = el('div', { cls: 'modal-overlay' },
    el('div', { cls: 'modal' },
      el('h3', { cls: 'modal-title' }, isEdit ? 'Edit Data Siswa' : 'Tambah Siswa Baru'),
      el('div', { cls: 'g2', style: { marginBottom: '12px' } },
        el('div', {}, el('label', { cls: 'field-label' }, 'NISN'), nisnInp),
        el('div', {}, el('label', { cls: 'field-label' }, 'Kata Sandi'), pwInp)
      ),
      el('div', { style: { marginBottom: '12px' } }, el('label', { cls: 'field-label' }, 'Nama Lengkap'), namaInp),
      el('div', { cls: 'g2', style: { marginBottom: '12px' } },
        el('div', {}, el('label', { cls: 'field-label' }, 'Kelas'), kelasInp),
        el('div', {}, el('label', { cls: 'field-label' }, 'Status'), el('div', { cls: 'toggle-grp' }, btnL, btnT))
      ),
      sklRow,
      el('div', { cls: 'modal-footer' },
        el('button', { cls: 'btn-cancel', onClick: () => overlay.remove() }, 'Batal'),
        el('button', { cls: 'btn-save', onClick: save }, 'Simpan')
      )
    )
  );

  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

/* ================================================================
   ADMIN PANEL
================================================================ */
function renderAdmin() {
  const d = S.data;
  document.title = 'Panel Admin – ' + d.school_info.name;
  let q = '';

  function getFiltered() {
    const lq = q.toLowerCase();
    return d.students.filter(s =>
      s.nama.toLowerCase().includes(lq) || s.nisn.includes(lq) || (s.kelas || '').toLowerCase().includes(lq)
    );
  }

  /* ── Stats ── */
  const totalV = el('div', { cls: 'stat-val' }, d.students.length.toString());
  const lulusV = el('div', { cls: 'stat-val' }, d.students.filter(s => s.lulus).length.toString());
  const tidakV = el('div', { cls: 'stat-val' }, d.students.filter(s => !s.lulus).length.toString());

  function refreshStats() {
    totalV.textContent = d.students.length;
    lulusV.textContent = d.students.filter(s => s.lulus).length;
    tidakV.textContent = d.students.filter(s => !s.lulus).length;
    countEl.textContent = `Data Siswa (${d.students.length})`;
  }

  function statBox(ico, valEl, lbl) {
    return el('div', { cls: 'stat-card' },
      ic(ico, { fontSize: '20px', color: 'var(--text2)', display: 'block', marginBottom: '4px' }),
      valEl,
      el('div', { cls: 'stat-lbl' }, lbl)
    );
  }

  /* ── Table ── */
  const tbody = el('tbody');

  function refreshTable() {
    tbody.innerHTML = '';
    const list = getFiltered();
    if (!list.length) {
      const msg = d.students.length === 0 ? "Belum ada siswa. Klik '+ Tambah' untuk mulai." : 'Tidak ada hasil yang cocok.';
      const td = document.createElement('td'); td.colSpan = 7; td.className = 'empty-state'; td.textContent = msg;
      tbody.appendChild(el('tr', {}, td));
      return;
    }
    for (const s of list) {
      const tr = el('tr', {},
        el('td', { cls: 'td-mono' }, s.nisn),
        el('td', { style: { fontWeight: '500' } }, s.nama),
        el('td', { cls: 'td-dim' }, s.kelas || '—'),
        el('td', { cls: 'td-mono' }, s.password),
        el('td', { html: `<span class="pill ${s.lulus ? 'pill-l' : 'pill-t'}">${s.lulus ? 'LULUS' : 'TIDAK'}</span>` }),
        el('td', { cls: 'td-dim', style: { color: s.lulus && s.skl_url ? 'var(--green-txt)' : 'var(--text3)' } },
          s.lulus ? (s.skl_url ? '✓ Ada' : '– Belum') : '—'
        ),
        el('td', {},
          el('button', { cls: 'btn-tbl btn-edit', onClick: () => openModal(s, saveStudent) }, 'Edit'),
          el('button', { cls: 'btn-tbl btn-del', onClick: () => delStudent(s.id) }, 'Hapus')
        )
      );
      tbody.appendChild(tr);
    }
  }

  function saveStudent(ns) {
    const exists = d.students.find(x => x.id === ns.id);
    d.students = exists ? d.students.map(x => x.id === ns.id ? ns : x) : [...d.students, ns];
    persists(d);
    refreshTable(); refreshStats();
  }

  function delStudent(id) {
    if (!confirm('Hapus data siswa ini?')) return;
    d.students = d.students.filter(s => s.id !== id);
    persists(d);
    refreshTable(); refreshStats();
  }

  refreshTable();

  /* ── Settings panel ── */
  let cfgOpen = false;
  const cfgPanel = el('div', { style: { display: 'none', marginBottom: '1.25rem' } });

  function buildCfg() {
    cfgPanel.innerHTML = '';
    const nameInp = mkInp({ type: 'text', value: d.school_info.name, placeholder: 'Nama sekolah' });
    const yearInp = mkInp({ type: 'text', value: d.school_info.year, placeholder: '2024/2025' });
    const apwInp  = mkInp({ type: 'password', placeholder: 'Kosongkan jika tidak diganti' });
    cfgPanel.appendChild(
      el('div', { cls: 'card', style: { padding: '1.5rem', background: 'var(--bg2)' } },
        el('div', { cls: 'section-lbl' }, 'Pengaturan Sekolah'),
        el('div', { cls: 'ga', style: { marginBottom: '1rem' } },
          el('div', {}, el('label', { cls: 'field-label' }, 'Nama Sekolah'), nameInp),
          el('div', {}, el('label', { cls: 'field-label' }, 'Tahun Ajaran'), yearInp),
          el('div', {}, el('label', { cls: 'field-label' }, 'Password Admin Baru'), apwInp)
        ),
        el('button', { cls: 'btn-save', onClick: () => {
          if (nameInp.value) d.school_info.name = nameInp.value;
          if (yearInp.value) d.school_info.year = yearInp.value;
          if (apwInp.value)  d.school_info.admin_password = apwInp.value;
          persists(d);
          schNameEl.textContent = d.school_info.name + ' · ' + d.school_info.year;
          document.title = 'Panel Admin – ' + d.school_info.name;
          cfgOpen = false; cfgPanel.style.display = 'none';
          buildCfg();
        }}, 'Simpan Pengaturan')
      )
    );
  }
  buildCfg();

  const schNameEl = el('p', { style: { fontSize: '13px', color: 'var(--text2)' } }, d.school_info.name + ' · ' + d.school_info.year);
  const countEl   = el('span', { style: { fontSize: '13px', fontWeight: '500', color: 'var(--text)' } }, `Data Siswa (${d.students.length})`);

  const searchInp = el('input', { placeholder: 'Cari nama / NISN / kelas...', cls: 'fi-search' });
  searchInp.addEventListener('input', e => { q = e.target.value; refreshTable(); });

  return el('div', { cls: 'admin-wrap fu' },
    /* Header */
    el('div', { cls: 'admin-hdr' },
      el('div', {},
        el('h1', { style: { fontFamily: "'Lora',serif", fontSize: '22px', fontWeight: '700', color: 'var(--text)', marginBottom: '3px' } }, 'Panel Admin'),
        schNameEl
      ),
      el('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } },
        el('button', { cls: 'btn-ghost', onClick: () => { cfgOpen = !cfgOpen; cfgPanel.style.display = cfgOpen ? 'block' : 'none'; } },
          ic('settings', { fontSize: '14px' }), ' Pengaturan'
        ),
        el('button', { cls: 'btn-ghost', onClick: () => go({ view: 'login' }) },
          ic('logout', { fontSize: '14px' }), ' Keluar'
        )
      )
    ),

    cfgPanel,

    /* Stats */
    el('div', { cls: 'g3', style: { marginBottom: '1.25rem' } },
      statBox('users', totalV, 'Total Siswa'),
      statBox('circle-check', lulusV, 'Lulus'),
      statBox('circle-x',    tidakV, 'Belum Lulus')
    ),

    /* Tip SKL */
    el('div', { cls: 'alert a-tip', style: { marginBottom: '1.25rem' } },
      ic('bulb', { fontSize: '15px', flexShrink: '0', marginTop: '1px' }),
      el('span', {}, el('strong', {}, 'Cara upload SKL: '),
        'Upload PDF ke Google Drive → klik kanan → "Dapatkan link" → pilih "Siapa saja yang memiliki link" → paste URL di kolom SKL. Link download otomatis dikonversi.'
      )
    ),

    /* Table card */
    el('div', { cls: 'card', style: { padding: '1.25rem' } },
      el('div', { cls: 'search-row' },
        countEl,
        el('div', { style: { display: 'flex', gap: '8px' } },
          searchInp,
          el('button', { cls: 'btn-add', onClick: () => openModal(null, saveStudent) },
            ic('plus', { fontSize: '14px' }), ' Tambah'
          )
        )
      ),
      el('div', { cls: 'tbl-wrap' },
        el('table', {},
          el('thead', {},
            el('tr', {},
              ...['NISN', 'Nama', 'Kelas', 'Password', 'Status', 'SKL', 'Aksi'].map(h => el('th', {}, h))
            )
          ),
          tbody
        )
      )
    ),

    el('p', { style: { marginTop: '1rem', fontSize: '12px', color: 'var(--text3)', textAlign: 'center' } },
      'Password admin default: ', el('code', {}, 'admin2025'), ' · Ganti di Pengaturan'
    )
  );
}

/* ================================================================
   RENDER
================================================================ */
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const views = { login: renderLogin, dashboard: renderDashboard, 'admin-login': renderAdminLogin, admin: renderAdmin };
  app.appendChild((views[S.view] || renderLogin)());
}

render();
</script>
